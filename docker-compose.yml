services:
  redis:
    image: redis:alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  api:
    build: .
    ports:
      - "8848:8848"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/holocron.db
      - SECRET_KEY=${SECRET_KEY:-holocron_secret_key}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    volumes:
      - ./data:/app/data

  frontend:
    build: frontend
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  redis_data:
