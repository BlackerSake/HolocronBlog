
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=1r/s;
limit_req_status 429;


server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/api/v1/(login|register)${
        limit_req zone=auth_per_ip brust=5 nodelay;
        proxy_pass http://api:8848;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API 代理到后端
    location /api {
        limit_req zone=api_per_ip burst=30 nodelay;
        proxy_pass http://api:8848;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /articles {
        limit_req zone=api_per_ip burst=30 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        if ($http_accept !~* text/html) {
            proxy_pass http://api:8848;
            break;
        }
        try_files $uri /index.html;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /comments {
        limit_req zone=api_per_ip burst=30 nodelay;
        proxy_pass http://api:8848;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /notifications {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        if ($http_accept !~* text/html) {
            proxy_pass http://api:8848;
            break;
        }
        try_files $uri /index.html;
    }

    location /categories {
        proxy_pass http://api:8848;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /tags {
        proxy_pass http://api:8848;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA 路由：所有非文件请求返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
